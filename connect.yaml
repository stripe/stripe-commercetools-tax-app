deployAs:
  - name: tax-calculator
    applicationType: service
    endpoint: /taxCalculator
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CUSTOM_TYPE_PRODUCT_KEY
          description: Custom type key for product and line item tax code configuration
          default: 'connector-stripe-tax-product'
          required: true
        - key: CUSTOM_TYPE_CATEGORY_KEY
          description: Custom type key for category tax code configuration
          default: 'connector-stripe-tax-category'
          required: true
        - key: CUSTOM_TYPE_SHIPPING_KEY
          description: Custom type key for shipping method tax code configuration
          default: 'connector-stripe-tax-shipping'
          required: true
        - key: CUSTOM_TYPE_CART_KEY
          description: Custom type key for cart tax calculation reference
          default: 'connector-stripe-tax-calculation-reference'
          required: true
        - key: TAX_BEHAVIOR_DEFAULT
          description: Sets the default tax behavior for all tax calculations when no other rules apply
          default: 'exclusive'
        - key: TAX_BEHAVIOR_COUNTRY_MAPPING
          description: JSON string (with escaped double quotes) mapping country codes to their default tax behavior
          default: '{"US":"exclusive","CA":"exclusive","DE":"inclusive","FR":"inclusive","GB":"inclusive","AU":"inclusive","IT":"inclusive","ES":"inclusive","NL":"inclusive"}'
        - key: TAX_CODE_CATEGORY_MAPPING_JSON
          description: JSON string (with escaped double quotes) mapping commercetools categories to Stripe tax codes
          required: true
        - key: SHIP_FROM_REQUIRED
          description: Whether to require a ship from address for tax calculations (true or false)
          default: 'true'
        - key: SHIP_FROM_DEFAULT_BUSINESS_COUNTRY
          description: Default country for ship from address
        - key: SHIP_FROM_DEFAULT_BUSINESS_STATE
          description: Default state for ship from address
        - key: SHIP_FROM_DEFAULT_BUSINESS_CITY
          description: Default city for ship from address
        - key: SHIP_FROM_DEFAULT_BUSINESS_POSTAL_CODE
          description: Default postal code for ship from address
        - key: SHIP_FROM_DEFAULT_BUSINESS_LINE1
          description: Default line 1 for ship from address
        - key: SHIP_FROM_DEFAULT_BUSINESS_LINE2
          description: Default line 2 for ship from address
        - key: SHIP_FROM_CHANNEL_PRIORITY
          description: Comma-separated channel IDs for priority-based selection (e.g. 'channel-1,channel-2,channel-3')
        - key: ADDRESS_VALIDATION_STRIPE_DEFAULT_CURRENCY
          description: Default currency for Stripe verification
          default: 'usd'
  - name: order-syncer
    applicationType: event
    endpoint: /orderSyncer
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CUSTOM_TYPE_ORDER_KEY
          description: Custom type key for order tax calculation reference
          default: 'connector-stripe-tax-calculation-reference'
          required: true

inheritAs:
  configuration:
    standardConfiguration:
      - key: CTP_PROJECT_KEY
        description: Project key from commercetools composable commerce project
        required: true
      - key: CTP_REGION
        description: Region of commercetools composable commerce project
        required: true
    securedConfiguration:
      - key: CTP_CLIENT_ID
        description: Client id from commercetools composable commerce project
        required: true
      - key: CTP_CLIENT_SECRET
        description: Client secret from commercetools composable commerce project
        required: true
      - key: CTP_SCOPE
        description: Scope from commercetools composable commerce project
        required: true
      - key: STRIPE_API_TOKEN
        description: API Token for communication between the connector and Stripe tax provider
        required: true