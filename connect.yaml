deployAs:
  - name: tax-calculator
    applicationType: service
    endpoint: /
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: region of commercetools composable commerce project
        - key: TAX_BEHAVIOR_DEFAULT
          description: Sets the default tax behavior for all tax calculations when no other rules apply
        - key: COUNTRY_TAX_BEHAVIOR_MAPPING
          description: JSON string (with escaped double quotes) mapping country codes to their default tax behavior
        - key: TAX_CODE_MAPPING_JSON
          description: JSON string (with escaped double quotes) mapping commercetools categories to Stripe tax codes
        - key: SHIP_FROM_REQUIRED
          description: Whether to require a ship from address for tax calculations (true or false)
        - key: DEFAULT_BUSINESS_COUNTRY
          description: Default country (ship from address) for tax calculations
        - key: DEFAULT_BUSINESS_STATE
          description: Default state (ship from address) for tax calculations
        - key: DEFAULT_BUSINESS_CITY
          description: Default city (ship from address) for tax calculations
        - key: DEFAULT_BUSINESS_POSTAL_CODE
          description: Default postal code (ship from address) for tax calculations
        - key: DEFAULT_BUSINESS_LINE1
          description: Default line 1 (ship from address) for tax calculations
        - key: DEFAULT_BUSINESS_LINE2
          description: Default line 2 (ship from address) for tax calculations
        - key: CHANNEL_PRIORITY
          description: Comma-separated channel IDs for priority-based selection
        - key: ADDRESS_VALIDATION_RATE_LIMIT
          description: Rate limit for address validation in requests per minute
        - key: ADDRESS_VALIDATION_WINDOW_MINUTES
          description: Time window in minutes for address validation rate limit
        - key: ADDRESS_VALIDATION_STRIPE_DEFAULT_CURRENCY
          description: Default currency for Stripe verification
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: project key from commercetools composable commerce project
        - key: CTP_CLIENT_ID
          description: client id from commercetools composable commerce project
        - key: CTP_CLIENT_SECRET
          description: client secret from commercetools composable commerce project
        - key: CTP_SCOPE
          description: scope from commercetools composable commerce project
        - key: TAX_PROVIDER_API_TOKEN
          description: API Token for communication between the connector and tax provider
  - name: order-syncer
    applicationType: event
    endpoint: /orderSyncer
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: region of commercetools composable commerce project
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: project key from commercetools composable commerce project
        - key: CTP_CLIENT_ID
          description: client id from commercetools composable commerce project
        - key: CTP_CLIENT_SECRET
          description: client secret from commercetools composable commerce project
        - key: CTP_SCOPE
          description: scope from commercetools composable commerce project
        - key: TAX_PROVIDER_API_TOKEN
          description: API Token for communication between the connector and tax provider
