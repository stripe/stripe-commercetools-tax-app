deployAs:
  - name: tax-calculator
    applicationType: service
    endpoint: /taxCalculator
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: region of commercetools composable commerce project
        - key: TAX_BEHAVIOR_DEFAULT
          description: Sets the default tax behavior for all tax calculations when no other rules apply
        - key: COUNTRY_TAX_BEHAVIOR_MAPPING
          description: JSON string (with escaped double quotes) mapping country codes to their default tax behavior
        - key: TAX_CODE_MAPPING_JSON
          description: JSON string (with escaped double quotes) mapping commercetools categories to Stripe tax codes                   
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: project key from commercetools composable commerce project
        - key: CTP_CLIENT_ID
          description: client id from commercetools composable commerce project
        - key: CTP_CLIENT_SECRET
          description: client secret from commercetools composable commerce project
        - key: CTP_SCOPE
          description: scope from commercetools composable commerce project
        - key: TAX_PROVIDER_API_TOKEN
          description: API Token for communication between the connector and tax provider
  - name: order-syncer
    applicationType: event
    endpoint: /orderSyncer
    scripts:
      postDeploy: npm install && npm run connector:post-deploy
      preUndeploy: npm install && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: region of commercetools composable commerce project
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: project key from commercetools composable commerce project
        - key: CTP_CLIENT_ID
          description: client id from commercetools composable commerce project
        - key: CTP_CLIENT_SECRET
          description: client secret from commercetools composable commerce project
        - key: CTP_SCOPE
          description: scope from commercetools composable commerce project
        - key: TAX_PROVIDER_API_TOKEN
          description: API Token for communication between the connector and tax provider
